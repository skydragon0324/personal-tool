services:
  db:
    image: postgres:16-alpine
    container_name: daily-todo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: daily_todo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d daily_todo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
